name: Build and Release Oracle.exe

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npm run build

      - name: Upload Oracle.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Oracle.exe