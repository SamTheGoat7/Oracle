<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="wrap">
  <div id="glass">
    <div id="hudRow">
      <div id="hud">
        <div class="add-card" id="addCardBtn">+</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="ctrlBtn" id="layoutBtn" title="Toggle layout">
      <svg class="btn-icon icon-row" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5m14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5"/></svg>
      <svg class="btn-icon icon-column" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5m-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5"/></svg>
    </button>
    <button class="ctrlBtn" id="editBtn">
      <svg class="btn-icon" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 01.708 0l3 3a.5.5 0 010 .708l-10 10a.5.5 0 01-.168.11l-5 2a.5.5 0 01-.65-.65l2-5a.5.5 0 01.11-.168l10-10zM11.207 2.5L13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 01.5.5v.5h.5a.5.5 0 01.5.5v.5h.293l6.5-6.5zm-9.761 5.175l-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 015 12.5V12h-.5a.5.5 0 01-.5-.5V11h-.5a.5.5 0 01-.468-.325z"/></svg>
    </button>
    <button class="ctrlBtn" id="pinBtn">
      <svg class="btn-icon" viewBox="0 0 16 16"><path d="M9.828.722a.5.5 0 01.354.146l4.95 4.95a.5.5 0 010 .707c-.48.48-1.072.588-1.503.588-.177 0-.335-.018-.46-.039l-3.134 3.134a5.927 5.927 0 01.16 1.013c.046.702-.032 1.687-.72 2.375a.5.5 0 01-.707 0l-2.829-2.828-3.182 3.182c-.195.195-1.219.902-1.414.707-.195-.195.512-1.22.707-1.414l3.182-3.182-2.828-2.829a.5.5 0 010-.707c.688-.688 1.673-.767 2.375-.72a5.922 5.922 0 011.013.16l3.134-3.133a2.772 2.772 0 01-.04-.461c0-.43.108-1.022.589-1.503a.5.5 0 01.353-.146z"/></svg>
    </button>
    <button class="ctrlBtn" id="closeBtn">
      <svg class="btn-icon" viewBox="0 0 16 16"><path d="M2.146 2.854a.5.5 0 11.708-.708L8 7.293l5.146-5.147a.5.5 0 01.708.708L8.707 8l5.147 5.146a.5.5 0 01-.708.708L8 8.707l-5.146 5.147a.5.5 0 01-.708-.708L7.293 8 2.146 2.854z"/></svg>
    </button>
  </div>
</div>

<!-- ── Modal ── -->
<div id="modalOverlay">
  <div id="modalDialog">
    <label for="modalLabel">Label</label>
    <input type="text" id="modalLabel" placeholder="My Source" />
    <label for="modalUrl">URL</label>
    <input type="text" id="modalUrl" placeholder="https://..." />
    <div class="modal-actions">
      <button class="modal-btn" id="modalFugiBtn">Get Sources</button>
      <div class="modal-actions-right">
        <button class="modal-btn" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn primary" id="modalConfirmBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="src/renderer/state.js"></script>
<script src="src/renderer/cards.js"></script>
<script src="src/renderer/modal.js"></script>
<script src="src/renderer/dragdrop.js"></script>
<script src="src/renderer/resize.js"></script>
<script src="src/renderer/index.js"></script>

</body>
</html>
